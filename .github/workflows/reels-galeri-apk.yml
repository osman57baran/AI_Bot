name: Reels Galeri APK

on:
  push:
    paths:
      - "ReelsGaleri/**"
      - ".github/workflows/reels-galeri-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ReelsGaleri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ReelsGaleri-apk
          path: ReelsGaleri/app/build/outputs/apk/release/app-release.apk
